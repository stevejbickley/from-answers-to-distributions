primary_items: [A008, A165, E018, E025, F063, F118, F120, G006, Y002]
cultural_map_items: [A008, A165, E018, E025, F063, F118, F120, G006, Y002, Y003]
wave_codes: [5, 6, 7]
weight_variable: S017
country_variable: S003
country_alpha_variable: S009
year_variable: S020
year_min: 2005
year_max: 2022
wave_variable: S002VS
exclude_countries: [Egypt, Kuwait, Qatar, Tajikistan, Uzbekistan]
country_year_aggregation: equal_country_year_after_within_year_survey_weighting
js_log_base: 2
bootstrap_replicates: 5000
random_seed: 20260923
openai_label_repetitions: 3
option_order_repetitions: 4
option_order_country_sample: 12
paper_rescaling:
  pc1_multiplier: 1.81
  pc1_intercept: 0.38
  pc2_multiplier: 1.61
  pc2_intercept: -0.01

primary_model_conditions: [gpt4o_anchor, gpt56_sol, jev]
optional_model_conditions: [gpt56_terra]
reference_contemporary_condition: gpt56_sol
historical_anchor_condition: gpt4o_anchor

# OpenAI top-K censoring policy. Missing labels are never silently treated as exact zero.
openai_censoring:
  primary_missing_mass_upper_bound: 0.001
  strict_missing_mass_upper_bound: 0.0001
  primary_policy_name: tail_bound_0p001
  strict_policy_name: tail_bound_0p0001
  complete_only_policy_name: complete_only

# Frozen before examining the October 2026 revision outputs.
human_target:
  primary: pooled_equal_year
  sensitivities: [latest_available, wave7]
human_sampling:
  bootstrap_reps: 1000
  seed: 20260930
  effective_n_thresholds: [200, 500, 1000]
  batch_size: 100
  method: uniform_respondent_resampling_with_fixed_S017_weights
cultural_direction:
  min_human_shift_norm: 1.0e-8
  min_model_shift_norm: 1.0e-12
  bootstrap_reps: 5000
  seed: 20260930
entropy_robustness:
  leave_one_item_out: true
